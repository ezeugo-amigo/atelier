[package]
name = "lotus-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lotus desktop email client"

[lib]
name = "lotus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lotus-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
time = "=0.3.47"
