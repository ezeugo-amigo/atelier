[package]
name = "today-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Today — a warm, paper-like todo desktop app"

# Standalone crate (no top-level workspace) so the tool builds independently,
# matching the atelier convention of one self-contained tool per directory.

[lib]
name = "today_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "today-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
