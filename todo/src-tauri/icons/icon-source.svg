<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="app-shape">
      <path d="M512 48C231 48 48 231 48 512s183 464 464 464 464-183 464-464S793 48 512 48Z"/>
    </clipPath>
    <linearGradient id="warm-background" x1="170" y1="90" x2="860" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEFEFE"/>
      <stop offset="0.54" stop-color="#F6F2F0"/>
      <stop offset="1" stop-color="#E8E2DF"/>
    </linearGradient>
    <linearGradient id="paper" x1="250" y1="160" x2="820" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDFCFB"/>
      <stop offset="1" stop-color="#F1EAE7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="32" flood-color="#282524" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#282524" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g clip-path="url(#app-shape)">
    <rect width="1024" height="1024" fill="url(#warm-background)"/>

    <!-- Yesterday: a muted sheet behind today's list, encoding carry-over. -->
    <rect x="174" y="260" width="612" height="612" rx="88" fill="#D7D2D0" transform="rotate(-8 480 560)" opacity="0.88"/>
    <rect x="174" y="260" width="612" height="612" rx="88" fill="none" stroke="#E8E2DF" stroke-width="12" transform="rotate(-8 480 560)" opacity="0.9"/>
    <path d="M294 430h342M294 538h270M294 646h342" stroke="#969290" stroke-width="34" stroke-linecap="round" opacity="0.60" transform="rotate(-8 480 560)"/>

    <!-- Today. -->
    <rect x="242" y="178" width="612" height="612" rx="88" fill="url(#paper)" filter="url(#soft-shadow)" transform="rotate(4 548 484)"/>
    <rect x="242" y="178" width="612" height="612" rx="88" fill="none" stroke="#FEFEFE" stroke-width="10" opacity="0.76" transform="rotate(4 548 484)"/>

    <!-- List rows. -->
    <g transform="rotate(4 548 484)">
      <path d="M374 354h350M374 478h350M374 602h248" stroke="#1A1817" stroke-width="42" stroke-linecap="round" opacity="0.88"/>
      <circle cx="298" cy="354" r="24" fill="#AA412A"/>
      <circle cx="298" cy="478" r="24" fill="#AA412A"/>
      <circle cx="298" cy="602" r="26" fill="none" stroke="#AA412A" stroke-width="16"/>

      <!-- Completed ticks, deliberately chunky for 16–32 px sizes. -->
      <path d="M283 352l12 13 26-32" fill="none" stroke="#FEFEFE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M283 476l12 13 26-32" fill="none" stroke="#FEFEFE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
