<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Today — Todo</title>
  <link rel="stylesheet" href="styles/colors_and_type.css">
  <link rel="stylesheet" href="styles/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>

  <script src="elm.js"></script>
  <script type="module">
    import { wire } from "./db.js";

    const pad = (n) => String(n).padStart(2, "0");
    const localISODate = (date = new Date()) =>
      `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;

    let today = localISODate();

    const appRoot = document.getElementById("root");
    const app = Elm.Main.init({
      node: appRoot,
      flags: { today, seed: Date.now() },
    });

    wire(app);

    const autosizeSelector = "textarea[data-autosize]";
    let autosizeFrame = 0;

    const autosizeTextarea = (textarea) => {
      textarea.style.height = "auto";
      textarea.style.height = `${textarea.scrollHeight}px`;
    };

    const autosizeTextareas = () => {
      document.querySelectorAll(autosizeSelector).forEach(autosizeTextarea);
    };

    const scheduleAutosize = () => {
      cancelAnimationFrame(autosizeFrame);
      autosizeFrame = requestAnimationFrame(autosizeTextareas);
      setTimeout(autosizeTextareas, 0);
    };

    document.addEventListener("input", (event) => {
      if (event.target instanceof HTMLTextAreaElement && event.target.matches(autosizeSelector)) {
        autosizeTextarea(event.target);
      }
      scheduleAutosize();
    });
    document.addEventListener("keydown", scheduleAutosize);

    new MutationObserver(scheduleAutosize).observe(document.body, { childList: true, subtree: true });
    window.addEventListener("resize", scheduleAutosize);
    scheduleAutosize();

    let midnightTimer;

    const msUntilNextLocalMidnight = () => {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1, 0);
      return next.getTime() - now.getTime();
    };

    const checkToday = () => {
      const current = localISODate();
      if (current !== today) {
        today = current;
        app.ports.todayChanged.send(today);
      }
      scheduleNextDayCheck();
    };

    function scheduleNextDayCheck() {
      clearTimeout(midnightTimer);
      midnightTimer = setTimeout(checkToday, Math.max(1000, msUntilNextLocalMidnight()));
    }

    scheduleNextDayCheck();

    // Also check when the app wakes or is foregrounded; timer callbacks can be
    // delayed while a laptop sleeps or a webview is backgrounded.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkToday();
    });
    window.addEventListener("focus", checkToday);
  </script>
</body>
</html>
