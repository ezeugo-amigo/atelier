[package]
name = "lotus-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lotus desktop email client"

[lib]
name = "lotus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lotus-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# No rt-multi-thread: Tauri 2 owns the runtime. Nothing here calls Runtime::new
# or block_on, so a second runtime can never be constructed.
tokio = { version = "1", features = ["macros", "sync", "net", "time", "io-util"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
] , default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
mail-parser = "0.9"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
