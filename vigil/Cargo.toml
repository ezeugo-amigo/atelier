[workspace]
resolver = "2"
members = [
    "crates/vigil-core",
    "crates/vigil-tui",
    "crates/vigil-cli",
    "crates/vigil-adapter-claude",
    "crates/vigil-adapter-codex",
    "crates/vigil-adapter-pi",
    "crates/vigil-adapter-opencode",
    "crates/atelier-worktree",
    "crates/atelier-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["ezeugo"]
repository = "https://github.com/ezeugo-amigo/vigil"

[workspace.dependencies]
tokio          = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
chrono         = { version = "0.4", features = ["serde"] }
async-trait    = "0.1"
thiserror      = "2"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories    = "5"
anyhow         = "1"
clap           = { version = "4", features = ["derive"] }
ratatui        = "0.29"
crossterm      = { version = "0.28", features = ["event-stream"] }
rand           = "0.9"
