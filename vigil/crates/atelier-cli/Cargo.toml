vigil-adapter-codex  = { path = "../vigil-adapter-codex" }
vigil-adapter-pi     = { path = "../vigil-adapter-pi" }
vigil-adapter-opencode = { path = "../vigil-adapter-opencode" }
clap                 = { workspace = true }
anyhow               = { workspace = true }
