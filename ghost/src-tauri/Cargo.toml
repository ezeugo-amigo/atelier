[package]
name = "ghost-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ghost — a typing test that races your best run"

# Standalone crate (no top-level workspace) so the tool builds independently,
# matching the atelier convention of one self-contained tool per directory.

[lib]
name = "ghost_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ghost-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
